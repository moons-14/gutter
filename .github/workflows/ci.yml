name: CI
on: [push, pull_request]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24.19.0, package-manager-cache: false }
      - run: corepack enable && corepack prepare pnpm@11.20.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm audit:licenses && pnpm check && pnpm lint && pnpm typecheck && pnpm unit && pnpm build && pnpm --filter @gutter/web test:e2e
  compose-smoke:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Generate database password
        run: |
          password="$(openssl rand -hex 32)"
          echo "::add-mask::$password"
          echo "POSTGRES_PASSWORD=$password" >> "$GITHUB_ENV"
      - name: Generate Better Auth secret
        run: |
          install -d -m 700 secrets
          openssl rand -base64 48 > secrets/better_auth_secret
          chmod 444 secrets/better_auth_secret
      - run: docker compose up -d migrate
      - run: docker compose wait migrate
      - run: docker compose up -d api worker web
      - run: docker compose --profile test run --rm test
      - run: docker compose run --rm --no-deps migrate
      - if: failure()
        run: |
          docker compose ps
          docker compose logs
      - if: always()
        run: docker compose down --volumes --remove-orphans

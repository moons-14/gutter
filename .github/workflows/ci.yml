name: CI
on: [push, pull_request]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version: 24.19.0, package-manager-cache: false }
      - run: corepack enable && corepack prepare pnpm@11.20.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chrome
      - run: pnpm audit:licenses && pnpm verify:release-gate && pnpm check && pnpm check:openapi-compat && pnpm test:public && pnpm lint && pnpm typecheck && pnpm unit && pnpm build && pnpm --filter @gutter/web test:e2e
  compose-smoke:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Generate database password
        run: |
          password="$(openssl rand -hex 32)"
          echo "::add-mask::$password"
          echo "POSTGRES_PASSWORD=$password" >> "$GITHUB_ENV"
      - name: Generate service secrets
        run: |
          install -d -m 700 secrets
          openssl rand -base64 48 > secrets/better_auth_secret
          openssl rand -base64 48 > secrets/reader_capability_secret
          openssl rand -base64 36 > secrets/api_db_password
          openssl rand -base64 36 > secrets/worker_db_password
          chmod 444 secrets/*
      - run: docker compose up -d migrate
      - run: docker compose wait migrate
      - run: docker compose up -d api worker web
      - run: docker compose --profile test run --rm test
      - run: GUTTER_READER_SERVICE_URL=http://reader-fixture:3001 docker compose --profile public-api run --rm public-api-test
      - run: docker compose run --rm --no-deps migrate
      - if: failure()
        run: |
          docker compose ps
          docker compose logs
      - if: always()
        run: docker compose down --volumes --remove-orphans

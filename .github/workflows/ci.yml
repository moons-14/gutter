name: CI
on: [push, pull_request]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24.19.0, package-manager-cache: false }
      - run: corepack enable && corepack prepare pnpm@11.20.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chrome
      - run: pnpm audit:licenses && pnpm check && pnpm check:openapi-compat && pnpm lint && pnpm typecheck && pnpm unit && pnpm build && pnpm --filter @gutter/web test:e2e
      - name: OpenAPI breaking-change gate
        run: |
          git show origin/main:docs/openapi-v1.yaml > /tmp/openapi-base.yaml 2>/dev/null || cp docs/openapi-v1.yaml /tmp/openapi-base.yaml
          node scripts/check-openapi-compat.mjs /tmp/openapi-base.yaml docs/openapi-v1.yaml
  compose-smoke:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Generate database password
        run: |
          password="$(openssl rand -hex 32)"
          echo "::add-mask::$password"
          echo "POSTGRES_PASSWORD=$password" >> "$GITHUB_ENV"
      - name: Generate service secrets
        run: |
          install -d -m 700 secrets
          openssl rand -base64 48 > secrets/better_auth_secret
          openssl rand -base64 48 > secrets/reader_capability_secret
          openssl rand -base64 36 > secrets/api_db_password
          openssl rand -base64 36 > secrets/worker_db_password
          chmod 444 secrets/*
      - run: docker compose up -d migrate
      - run: docker compose wait migrate
      - run: docker compose up -d api worker web
      - run: docker compose --profile test run --rm test
      - run: docker compose run --rm --no-deps migrate
      - if: failure()
        run: |
          docker compose ps
          docker compose logs
      - if: always()
        run: docker compose down --volumes --remove-orphans

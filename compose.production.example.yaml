# Copy and adapt this file outside version control. Docker secrets are mounted files.
services:
  db:
    environment:
      POSTGRES_PASSWORD: !reset null
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
  migrate:
    environment:
      DATABASE_URL: !reset null
      DATABASE_URL_FILE: /run/secrets/database_url
      GUTTER_API_DB_PASSWORD_FILE: /run/secrets/api_db_password
      GUTTER_WORKER_DB_PASSWORD_FILE: /run/secrets/worker_db_password
    secrets: [database_url, api_db_password, worker_db_password]
  api:
    environment:
      DATABASE_URL: !reset null
      DATABASE_HOST: db
      DATABASE_NAME: gutter
      DATABASE_USER: gutter_api
      DATABASE_PASSWORD_FILE: /run/secrets/api_db_password
      BETTER_AUTH_SECRET_FILE: /run/secrets/better_auth_secret
      GUTTER_READER_CAPABILITY_SECRET_FILE: /run/secrets/reader_capability_secret
      GUTTER_AUTH_ORIGIN: https://gutter.example.invalid
      GUTTER_AUTH_TRUSTED_PROXIES_JSON: '[]'
    secrets: [api_db_password, better_auth_secret, reader_capability_secret]
  worker:
    environment:
      DATABASE_URL: !reset null
      DATABASE_HOST: db
      DATABASE_NAME: gutter
      DATABASE_USER: gutter_worker
      DATABASE_PASSWORD_FILE: /run/secrets/worker_db_password
      GUTTER_READER_CAPABILITY_SECRET_FILE: /run/secrets/reader_capability_secret
    secrets: [worker_db_password, reader_capability_secret]
  web:
    # Caddy is the sole public ingress and TLS terminator. Replace this hostname before use.
    environment:
      GUTTER_SITE_ADDRESS: https://gutter.example.invalid
    cap_add: [NET_BIND_SERVICE]
    ports: !override ['80:80', '443:443', '443:443/udp']
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    networks: [internal, edge]
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1:2019/config/']
      interval: 5s
      timeout: 3s
      retries: 20
secrets:
  api_db_password:
    file: ./secrets/api_db_password
  postgres_password:
    file: ./secrets/postgres_password
  database_url:
    file: ./secrets/database_url
  better_auth_secret:
    file: ./secrets/better_auth_secret
  reader_capability_secret:
    file: ./secrets/reader_capability_secret
  worker_db_password:
    file: ./secrets/worker_db_password
volumes:
  caddy-data:
  caddy-config:
networks:
  edge:

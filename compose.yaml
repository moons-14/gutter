services:
  db:
    image: postgres:18.1@sha256:1090bc3a8ccfb0b55f78a494d76f8d603434f7e4553543d6e807bc7bd6bbd17f
    environment:
      POSTGRES_DB: gutter
      POSTGRES_USER: gutter
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes: [db-data:/var/lib/postgresql]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U gutter -d gutter]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]
  migrate:
    build: { context: ., target: migrate }
    command: [node, --import, tsx, src/migrate.ts]
    environment:
      DATABASE_URL: 'postgresql://gutter:${POSTGRES_PASSWORD:-}@db:5432/gutter'
      GUTTER_API_DB_PASSWORD_FILE: /run/secrets/api_db_password
      GUTTER_WORKER_DB_PASSWORD_FILE: /run/secrets/worker_db_password
    depends_on: { db: { condition: service_healthy } }
    restart: 'no'
    networks: [internal]
    secrets: [api_db_password, worker_db_password]
  api:
    image: gutter-release-api:local
    build: { context: ., target: api }
    command: [node, --import, tsx, src/index.ts]
    environment:
      DATABASE_HOST: db
      DATABASE_NAME: gutter
      DATABASE_USER: gutter_api
      DATABASE_PASSWORD_FILE: /run/secrets/api_db_password
      BETTER_AUTH_SECRET_FILE: /run/secrets/better_auth_secret
      GUTTER_READER_CAPABILITY_SECRET_FILE: /run/secrets/reader_capability_secret
      GUTTER_READER_SERVICE_URL: ${GUTTER_READER_SERVICE_URL:-http://worker:3001}
      GUTTER_AUTH_ORIGIN: ${GUTTER_AUTH_ORIGIN:-http://localhost:8080}
      # Docker assigns internal addresses; Better Auth ignores forwarded client IPs unless an
      # operator explicitly supplies a verified proxy identity for the deployment.
      GUTTER_AUTH_TRUSTED_PROXIES_JSON: '[]'
    depends_on: { migrate: { condition: service_completed_successfully } }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]
    secrets: [api_db_password, better_auth_secret, reader_capability_secret]
  worker:
    image: gutter-release-worker:local
    build: { context: ., target: worker }
    command: [node, --import, tsx, src/index.ts]
    environment:
      DATABASE_HOST: db
      DATABASE_NAME: gutter
      DATABASE_USER: gutter_worker
      DATABASE_PASSWORD_FILE: /run/secrets/worker_db_password
      GUTTER_READER_CAPABILITY_SECRET_FILE: /run/secrets/reader_capability_secret
      GUTTER_ALLOWED_ROOTS_JSON: '[]'
      GUTTER_DERIVED_CACHE_ROOT: /cache/derived
      GUTTER_DERIVED_CACHE_QUOTA_BYTES: '10737418240'
    depends_on: { migrate: { condition: service_completed_successfully } }
    volumes: [cache-data:/cache]
    expose: ['9090']
    networks: [internal]
    secrets: [worker_db_password, reader_capability_secret]
  web:
    image: gutter-release-web:local
    build:
      context: .
      dockerfile: Dockerfile.web
    depends_on: { api: { condition: service_healthy } }
    # Keep the default ingress host-local. Operators can put a reverse proxy or Tailscale in
    # front without publishing the API or worker directly.
    ports: ['127.0.0.1:8080:8080']
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1:8080/']
      interval: 5s
      timeout: 3s
      retries: 20
    # An internal-only Docker network cannot receive host-published traffic. Web straddles the
    # public bridge and the Compose-internal application network; API and worker remain internal.
    networks:
      internal: {}
      public: {}
  test:
    build: { context: ., target: api }
    profiles: [test]
    command:
      - sh
      - -ec
      - >-
        node -e "Promise.all(['http://web:8080/api/health','http://web:8080/manifest.webmanifest','http://web:8080/service-worker.js'].map(url=>fetch(url))).then(async rs=>{if(!rs.every(r=>r.ok))throw Error('smoke response');if(!(await rs[1].text()).includes('192x192'))throw Error('manifest');}).catch(e=>{console.error(e);process.exit(1)})"
    depends_on: { api: { condition: service_healthy }, web: { condition: service_healthy } }
    networks: [internal]
  public-api-test:
    build: { context: ., target: build }
    command: [pnpm, test:public]
    environment:
      PUBLIC_API_BASE_URL: http://web:8080
      PUBLIC_API_ORIGIN: http://localhost:8080
      DATABASE_URL: 'postgresql://gutter:${POSTGRES_PASSWORD:-}@db:5432/gutter'
    depends_on:
      web: { condition: service_healthy }
      reader-fixture: { condition: service_started }
    profiles: [public-api]
    networks: [internal]
  reader-fixture:
    image: node:24.19.0-bookworm-slim@sha256:3638d9a6fe4030bd716be989438248074489337ba3275657f93595428be4fc03
    working_dir: /src
    command: [node, tests/public-reader-fixture.mjs]
    volumes: [.:/src:ro]
    profiles: [public-api]
    networks: [internal]
  auth-test:
    build: { context: ., target: auth-test }
    command: [node, --import, tsx, --test, --test-reporter=spec, tests/auth-runtime.mts]
    environment:
      AUTH_BASE_URL: http://web:8080
      AUTH_PUBLIC_ORIGIN: http://localhost:8080
      DATABASE_URL: 'postgresql://gutter:${POSTGRES_PASSWORD:-}@db:5432/gutter'
    depends_on: { web: { condition: service_healthy } }
    profiles: [auth-test]
    networks: [internal]
  auth-rate-peer-a:
    build: { context: ., target: auth-test }
    command: [node, tests/auth-rate-peer.mjs]
    environment:
      AUTH_BASE_URL: http://web:8080
      AUTH_PUBLIC_ORIGIN: http://localhost:8080
      AUTH_PEER_LABEL: a
    profiles: [auth-test]
    networks: [internal]
  auth-rate-peer-b:
    build: { context: ., target: auth-test }
    command: [node, tests/auth-rate-peer.mjs]
    environment:
      AUTH_BASE_URL: http://web:8080
      AUTH_PUBLIC_ORIGIN: http://localhost:8080
      AUTH_PEER_LABEL: b
    profiles: [auth-test]
    networks: [internal]
  integration:
    build: { context: ., target: build }
    # Unit tests run in their own gate. This image intentionally has no Git binary, while a few
    # release-evidence unit fixtures create temporary repositories.
    command: [pnpm, integration]
    environment:
      DATABASE_URL: 'postgresql://gutter:${POSTGRES_PASSWORD:-}@integration-db:5432/gutter_integration'
      GUTTER_INTEGRATION_TEST: '1'
    depends_on:
      integration-db: { condition: service_healthy }
    profiles: [integration]
    networks: [internal]
  integration-db:
    image: postgres:18.1@sha256:1090bc3a8ccfb0b55f78a494d76f8d603434f7e4553543d6e807bc7bd6bbd17f
    environment:
      POSTGRES_DB: gutter_integration
      POSTGRES_USER: gutter
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    healthcheck:
      test: [CMD-SHELL, pg_isready -U gutter -d gutter_integration]
      interval: 5s
      timeout: 3s
      retries: 20
    profiles: [integration, scale]
    networks: [internal]
  scale-oracles:
    build: { context: ., target: build }
    command: [pnpm, integration:scale-oracles]
    environment:
      GUTTER_SCALE_ORACLE: '1'
      SCALE_RUN_ID: '${SCALE_RUN_ID:-local}'
      SCALE_ROOT_ID: '${SCALE_ROOT_ID:-scale-worker-root}'
      SCALE_EVIDENCE_PATH: /scale-evidence/evidence.json
      SCALE_FULL: '${SCALE_FULL:-}'
      SCALE_BOOKS: '${SCALE_BOOKS:-1000}'
      SCALE_PAGES_PER_BOOK: '${SCALE_PAGES_PER_BOOK:-10}'
      SCALE_SOURCE_ROOT: /scale-source
      DATABASE_URL: 'postgresql://gutter:${POSTGRES_PASSWORD:-}@integration-db:5432/gutter_integration'
    depends_on:
      integration-db: { condition: service_healthy }
      scale-migrate: { condition: service_completed_successfully }
      scale-worker: { condition: service_started }
    profiles: [scale]
    volumes:
      - scale-source:/scale-source
      - scale-cache:/cache
      - '${SCALE_EVIDENCE_DIR:-/tmp/gutter-scale-evidence-local}:/scale-evidence'
    networks: [internal]
  scale-worker:
    build: { context: ., target: worker }
    command: [node, --import, tsx, dist/index.js]
    environment:
      DATABASE_HOST: integration-db
      DATABASE_NAME: gutter_integration
      DATABASE_USER: gutter_worker
      DATABASE_PASSWORD_FILE: /run/secrets/worker_db_password
      GUTTER_ALLOWED_ROOTS_JSON: '[{"id":"${SCALE_ROOT_ID:-scale-worker-root}","path":"/scale-source"}]'
      GUTTER_SCALE_ORACLE: '1'
      GUTTER_READER_CAPABILITY_SECRET: scale-oracle-reader-secret-012345678901234567890123
      BETTER_AUTH_SECRET: scale-oracle-auth-secret-012345678901234567890123456789
      GUTTER_STABLE_GRACE_MS: '0'
      GUTTER_WATCHER_HINTS_ENABLED: 'false'
      GUTTER_DERIVED_CACHE_ROOT: /cache/derived
    depends_on: { scale-migrate: { condition: service_completed_successfully } }
    profiles: [scale]
    restart: on-failure
    volumes:
      - scale-source:/scale-source:ro
      - scale-cache:/cache
    networks: [internal]
    secrets: [worker_db_password, reader_capability_secret]
  scale-migrate:
    build: { context: ., target: migrate }
    command: [node, --import, tsx, src/migrate.ts]
    environment:
      DATABASE_URL: 'postgresql://gutter:${POSTGRES_PASSWORD:-}@integration-db:5432/gutter_integration'
      GUTTER_API_DB_PASSWORD_FILE: /run/secrets/api_db_password
      GUTTER_WORKER_DB_PASSWORD_FILE: /run/secrets/worker_db_password
    depends_on: { integration-db: { condition: service_healthy } }
    profiles: [scale]
    networks: [internal]
    secrets: [api_db_password, worker_db_password]
volumes:
  db-data:
  cache-data:
  scale-source:
  scale-cache:
secrets:
  api_db_password:
    file: ./secrets/api_db_password
  better_auth_secret:
    file: ./secrets/better_auth_secret
  reader_capability_secret:
    file: ./secrets/reader_capability_secret
  worker_db_password:
    file: ./secrets/worker_db_password
networks:
  public:
  internal:
    internal: true
